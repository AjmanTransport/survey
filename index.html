<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Passenger Survey</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f8f9fa, #e9ecef);
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #007BFF;
      padding: 10px 20px;
      color: white;
    }
    header img {
      height: 40px;
    }
    .lang-switch button {
      background-color: #28a745;
      border: none;
      color: white;
      padding: 6px 12px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    form {
      background-color: white;
      max-width: 600px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #007BFF;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    select, input[type="text"], input[type="submit"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .note {
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
    }
    #spinner {
      display: none;
      text-align: center;
      margin: 15px;
    }
    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #007BFF;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo" />
    <div class="lang-switch"><button onclick="cycleLang()">English / عربي / اردو</button></div>
  </header>

  <div id="spinner"><div class="loader"></div></div>

  
<form id="surveyForm">
  <h2 id="formTitle">🚌 Passenger Survey for Sheikh Ammar Street Route</h2>

  <div class="note" id="gpsNote">
    📍 Please enable GPS when prompted. It helps us improve transport services in your area.
  </div>


   <div class="question">
        <label for="q1_residential_area" id="q1Label">1. What is your residential area?</label>
        <input type="text" id="q1_residential_area" name="q1_residential_area" required>
      </div>


  <label id="q2Label">2. Are you satisfied with the current bus route?</label>
  <select name="q2_satisfied_current_bus_route" required>
    <option value="">--Choose--</option>
    <option value="yes">yes</option>
    <option value="No">NO</option>
  </select>


   <div class="question">
        <label for="q3_modifications_to_route" id="q3Label">3. What modifications would you suggest for the route?</label>
        <input type="text" id="q3_modifications_to_route" name="q3_modifications_to_route" >
      </div>

   

      <label id="q4Label">Do you suggest adding a new bus stop?</label>
  <select name="q4_Do_you_suggest_adding_a_new_bus_stop" required>
    <option value="">--Choose--</option>
    <option value="yes">yes</option>
    <option value="No">NO</option>
  </select>


      <div class="question">
        <label for="q5_which_bus_stop_suggest_adding" id="q5Label">5. If yes, which bus stop do you suggest adding?</label>
        <input type="text" id="q5_which_bus_stop_suggest_adding" name="q5_which_bus_stop_suggest_adding">
      </div>




        <label id="q6Label">Are you satisfied with the trip schedules?</label>
  <select name="q6_Are_you_satisfied_with_the_trip_schedules" required>
    <option value="">--Choose--</option>
    <option value="yes">yes</option>
    <option value="No">NO</option>
  </select>


  <div class="question">
        <label for="q7_what_trip_times_do_you_recommend" id="q7Label">7. If no, what trip times do you recommend?</label>
        <input type="text" id="q7_what_trip_times_do_you_recommend" name="q7_what_trip_times_do_you_recommend">
      </div>

  <div class="question">
        <label for="q8_What_destination_would_you_like_to_travel_to" id="q8Label">8. What destination would you like to travel to?</label>
        <input type="text" id="q8_What_destination_would_you_like_to_travel_to" name="q8_What_destination_would_you_like_to_travel_to" required>
      </div>

  <div class="question">
        <label for="q9_What_is_your_preferred_boarding_stop" id="q9Label">9. What is your preferred boarding stop?</label>
        <input type="text" id="q9_What_is_your_preferred_boarding_stop" name="q9_What_is_your_preferred_boarding_stop" required>
      </div>

  <div class="question">
        <label for="q10_What_is_your_preferred_drop_off_stop" id="q10Label">10. What is your preferred drop-off stop?</label>
        <input type="text" id="q10_What_is_your_preferred_drop_off_stop" name="q10_What_is_your_preferred_drop_off_stop" required>
      </div>

  
  <label id="q11Label">11. Preferred Payment Method</label>
  <select name="q11_paymentMethod" required>
    <option value="">--Choose--</option>
    <option value="Cash">Cash</option>
    <option value="Bank Card">Bank Card</option>
  </select>

<div class="question">
        <label for="q12_What_is_your_contact_number" id="q12Label">12. What is your contact number?</label>
        <input type="text" id="q12_What_is_your_contact_number" name="q12_What_is_your_contact_number">
      </div>

      
<div class="question">
        <label for="q13_Do_you_have_any_complaints_or_suggestions" id="q13Label">13. Do you have any complaints or suggestions?</label>
        <input type="text" id="q13_Do_you_have_any_complaints_or_suggestions" name="q13_Do_you_have_any_complaints_or_suggestions">
      </div>


<div class="question">
        <label for="q14_Do_you_use_more_than_one_route_to_reach_your_destination" id="q14Label">14. Do you use more than one route to reach your destination?</label>
        <input type="text" id="q14_Do_you_use_more_than_one_route_to_reach_your_destination" name="q14_Do_you_use_more_than_one_route_to_reach_your_destination" required>
      </div>


      <div class="question">
        <label for="q15_Specify_the_names_of_the_routes_you_use_to_reach_your_destination" id="q15Label">15. Specify the names of the routes you use to reach your destination?</label>
        <input type="text" id="q15_Specify_the_names_of_the_routes_you_use_to_reach_your_destination" name="q15_Specify_the_names_of_the_routes_you_use_to_reach_your_destination">
      </div>



  <input type="submit" class="button" value="Submit Survey">
</form>


  <script>
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0,
          v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    let latitude = "";
    let longitude = "";
    let deviceUUID = localStorage.getItem("device_uuid");
    if (!deviceUUID) {
      deviceUUID = generateUUID();
      localStorage.setItem("device_uuid", deviceUUID);
    }

    document.getElementById("surveyForm").addEventListener("submit", function (e) {
      e.preventDefault();

      if (!latitude || !longitude) {
        alert("⚠️ Please enable GPS and refresh the page again to submit the survey.");
        return;
      }

      document.getElementById("spinner").style.display = "block";
      const submitButton = document.querySelector('input[type="submit"]');
      submitButton.disabled = true;

      const formData = new FormData(this);
      const data = {
        q1_residential_area: formData.get("q1_residential_area"),
        q2_satisfied_current_bus_route: formData.get("q2_satisfied_current_bus_route"),
        q3_modifications_to_route: formData.get("q3_modifications_to_route"),
        q4_suggest_adding_new_bus_stop: formData.get("q4_suggest_adding_new_bus_stop"),
        q5_which_bus_stop_suggest_adding: formData.get("q5_which_bus_stop_suggest_adding"),
        q6_satisfied_with_the_trip_schedules: formData.get("q6_satisfied_with_the_trip_schedules"),
        q7_what_trip_times_do_you_recommend: formData.get("q7_what_trip_times_do_you_recommend"),
        q8_What_destination_would_you_like_to_travel_to: formData.get("q8_What_destination_would_you_like_to_travel_to"),
        q9_What_is_your_preferred_boarding_stop: formData.get("q9_What_is_your_preferred_boarding_stop"),
        q10_What_is_your_preferred_drop_off_stop: formData.get("q10_What_is_your_preferred_drop_off_stop"),
        q11_paymentMethod: formData.get("q11_paymentMethod"),
        q12_What_is_your_contact_number: formData.get("q12_What_is_your_contact_number"),
        q13_Do_you_have_any_complaints_or_suggestions: formData.get("q13_Do_you_have_any_complaints_or_suggestions"),
        q14_Do_you_use_more_than_one_route_to_reach_your_destination: formData.get("q14_Do_you_use_more_than_one_route_to_reach_your_destination"),
        q15_Specify_the_names_of_the_routes_you_use_to_reach_your_destination: formData.get("q15_Specify_the_names_of_the_routes_you_use_to_reach_your_destination"),


        latitude,
        longitude,
        uuid: deviceUUID
      };

      fetch("https://script.google.com/macros/s/AKfycbxYfBTK5-66IUyzUh4_6kA4DRceCHXAy4Ssexfpw981XzGht-BAFZW1ECKMw8pXTY4/exec", {
        method: "POST",
        body: JSON.stringify(data)
      })
      .then(res => res.text())
      .then(response => {
        
if (response === "duplicate" && !["c84793f2-5af0-4a37-9387-afb22ccb1d44", "b32a458a-0c0a-45f6-ae11-13fa08e79922" ,"eef60b4c-4e9e-4bca-be3c-cdab50dab571" ,"775ad373-c1ed-4550-8f53-dc403cae8deb","a4f0cf39-9185-4b3a-9e9a-fbaf6a842e3a" ,"da45cbbd-0fe8-4558-b2db-109c567c754c"].includes(deviceUUID)) {

          alert("⚠️ You have already submitted this survey from this device.");
          return;
        }
        alert("✅ Thank you! Your feedback has been submitted.");
        this.reset();
      })
      .catch(() => {
        alert("❌ Submission failed. Please try again.");
      })
      .finally(() => {
        document.getElementById("spinner").style.display = "none";
        submitButton.disabled = false;
      });
    });

    window.onload = function () {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (position) {
          latitude = position.coords.latitude;
          longitude = position.coords.longitude;
        }, function () {
          alert("⚠️ Please enable GPS and refresh the page.");
        });
      }
    };
  
    let langIndex = 0;
    const langs = ["en", "ar", "ur"];

    
    const translations = {
      en: {
        title: "🚌 Passenger Survey for Sheikh Ammar Street Route",
        gps: "📍 Please enable location services on your phone and allow access to your geographic location to help improve transport services.",
        q1: "1. What is your residential area?",
        q2: "2. Are you satisfied with the current bus route?",
        q3: "3. What modifications would you suggest for the route?",
        q4: "4. Do you suggest adding a new bus stop?",
        q5: "5. If yes, which bus stop do you suggest adding?",
        q6: "6. Are you satisfied with the trip schedules from Al Musalla Station?",
        q7: "7. If your answer is No, what trip times do you suggest from Al Musalla Station?",
        q8: "8. What destination would you like to travel to?",
        q9: "9. What is your preferred boarding stop?",
        q10: "10. What is your preferred drop-off stop?",
        q11: "11. Preferred Payment Method",
        q12: "12. What is your contact number?",
        q13: "13. Do you have any complaints or suggestions?",
        q14: "14.Do you use more than one route to reach your destination?",
        q15: "15.Specify the names of the routes you use to reach your destination?"
        
        
      },
      ar: {
        title: "🚌 استبيان الركاب لخط الشيخ عمار   ",
        gps: "📍 الرجاء تفعيل خدمة الموقع في هاتفك والسماح بالوصول إلى الموقع الجغرافي لتحسين خدمات النقل.",
        q1: " ماهي منطقة السكن؟",
        q2: "هل انت راضي عن مسار الخط الحالي ؟",
        q3: "ماهو التعديل المقترح على المسار ؟ ",
        q4: "هل تقترح إضافة موقف ؟",
        q5: "اذا كانت الاجابة بنعم ماهو الموقف المقترح اضافته ؟",
        q6: "هل انت راضي عن أوقات الرحلات من محطة المصلي؟ ",
        q7: "اذا كانت الاجابة بلا ماهي الاوقات التي تقترحها للرحلات من محطة المصلي؟",
        q8: "ماهي الوجهة التي تود الذهاب اليها  ؟",
        q9: "ماهو موقف الركوب المفضل؟",
        q10: "ماهو موقف النزول المفضل؟",
        q11: " ماهي طريقة الدفع المفضلة",
        q12: "ما هو رقم التواصل؟",
        q13: "هل لديك اي شكاوي او اقتراحات؟",
        q14: "هل تستخدم  اكثر من خط للوصول الي وجهتك؟",
        q15:  "حدد اسماء الخطوط التي تستخدمها للوصول الي وجهتك ؟"

      
       
      },
      ur: {
        title: "🚌  شیخ عمار روٹ کے لیے مسافروں کا سروے ",
        gps: "📍 براہ کرم اپنے فون میں لوکیشن سروس کو فعال کریں اور جغرافیائی مقام تک رسائی کی اجازت دیں تاکہ نقل و حمل کی خدمات کو بہتر بنایا جا سکے۔",
        q1: "آپ کس علاقے میں رہتے ہیں؟",
        q2: "کیا آپ موجودہ بس روٹ سے مطمئن ہیں؟",
        q3: "آپ اس روٹ میں کون سی تبدیلی کی تجویز دیتے ہیں؟",
        q4: "کیا آپ کوئی نیا بس اسٹاپ شامل کرنے کی تجویز دیتے ہیں؟",
        q5: "اگر جواب ہاں ہے تو آپ کون سا بس اسٹاپ شامل کرنے کی تجویز دیتے ہیں؟",
        q6: "کیا آپ المصلیٰ اسٹیشن سے روانگی کے اوقات سے مطمئن ہیں؟  ",
        q7: "اگر آپ کا جواب نہیں ہے، تو المصلیٰ اسٹیشن سے روانگی کے لیے آپ کون سے اوقات تجویز کرتے ہیں؟",
        q8: "آپ کس منزل پر جانا چاہیں گے؟",
        q9: "آپ کا پسندیدہ سوار ہونے کا بس اسٹاپ کون سا ہے؟",
        q10: "آپ کا پسندیدہ اترنے کا بس اسٹاپ کون سا ہے؟",
        q11: "آپ کی پسندیدہ ادائیگی کا طریقہ کیا ہے؟",
        q12: "آپ کا رابطہ نمبر کیا ہے؟",
        q13: "کیا آپ کے پاس کوئی شکایات یا تجاویز ہیں؟",
        q14:"کیا آپ اپنی منزل تک پہنچنے کے لیے ایک سے زیادہ روٹس (لائنز) استعمال کرتے ہیں؟",
        q15:"براہِ کرم اُن روٹس (لائنز) کے نام بتائیں جو آپ اپنی منزل تک پہنچنے کے لیے استعمال کرتے ہیں۔؟"
      }
    };


    function cycleLang() {
      langIndex = (langIndex + 1) % langs.length;
      applyLang();
    }

    function applyLang() {
      const lang = langs[langIndex];
      const t = translations[lang];
      document.getElementById("formTitle").innerText = t.title;
      document.getElementById("gpsNote").innerText = t.gps;
      document.getElementById("q1Label").innerText = t.q1;
      document.getElementById("q2Label").innerText = t.q2;
      document.getElementById("q3Label").innerText = t.q3;
      document.getElementById("q4Label").innerText = t.q4;
      document.getElementById("q5Label").innerText = t.q5;
      document.getElementById("q6Label").innerText = t.q6;
      document.getElementById("q7Label").innerText = t.q7;
      document.getElementById("q8Label").innerText = t.q8;
      document.getElementById("q9Label").innerText = t.q9;
      document.getElementById("q10Label").innerText = t.q10;
      document.getElementById("q11Label").innerText = t.q11;
      document.getElementById("q12Label").innerText = t.q12;
      document.getElementById("q13Label").innerText = t.q13;
      document.getElementById("q14Label").innerText = t.q14;
      document.getElementById("q15Label").innerText = t.q15;

      document.body.classList.toggle("rtl", lang !== "en");
    }
    

    const userLang = navigator.language || navigator.userLanguage;
    if (userLang.startsWith("ar")) langIndex = 1;
    else if (userLang.startsWith("ur")) langIndex = 2;
    applyLang();
</script>
</body>
</html>
